<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokeTrade">
<title>PokeTrade</title>
<style>
:root{--bg:#111318;--card:#1a1d24;--card2:#222632;--line:#2c3140;--txt:#e9ecf2;--mut:#8b93a7;--acc:#ffcb05;--pos:#3ecf8e;--neg:#ff6b6b;--blue:#5aa9ff;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(17,19,24,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header h1 span{color:var(--acc)}
#sync{font-size:12px;color:var(--mut)}
main{max-width:760px;margin:0 auto;padding:14px 14px 100px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#151820;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--mut);padding:9px 0 10px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}
nav button.add b{background:var(--acc);color:#111;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}
input,select{width:100%;margin-top:3px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px;font:inherit;font-size:16px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.dng{color:var(--neg)}
.btn:disabled{opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi small{display:block;color:var(--mut);font-size:12px}
.kpi b{font-size:20px;display:block;margin-top:2px}
.kpi[data-act]{cursor:pointer;position:relative}
.kpi[data-act]:after{content:'›';position:absolute;right:10px;top:8px;color:var(--mut);font-size:16px}
.kpi[data-act]:active{border-color:var(--acc)}
.vtext{white-space:pre-wrap;font-size:14px;line-height:1.5}
.vtext .vh{display:block;font-weight:700;font-size:16px;color:var(--acc);margin-top:14px}
.vblock{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.vblock pre{white-space:pre-wrap;font:14px/1.45 system-ui,-apple-system,sans-serif;margin:0 0 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{display:flex;align-items:center;gap:8px}.sheet h2 span{flex:1}
.drow{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.drow[data-act]{cursor:pointer}.drow .l{flex:1;min-width:0}.drow .l b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drow .l small{color:var(--mut);font-size:12px}
.drow .a{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dgroup{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:14px 0 2px;display:flex;justify-content:space-between}
.dtotal{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding:12px 2px 4px}
.kpi.hero{grid-column:1/-1;text-align:center;padding:16px}
.kpi.hero b{font-size:32px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;cursor:pointer}
.thumb{width:50px;height:68px;border-radius:6px;object-fit:cover;background:var(--card2);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.meta{flex:1;min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{text-align:right;font-size:13px;flex:none}
.nums b{display:block;font-size:15px}
.gr{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:4px;background:#fff;color:#111}
.gr.gold{background:linear-gradient(135deg,#f5d77a,#c9a227);color:#111}
.gr.black{background:#000;color:#f5d77a;border:1px solid #c9a227}
.gr.raw{background:var(--card2);color:var(--mut);font-weight:500}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;margin-top:4px;margin-left:4px;border:1px solid var(--line);color:var(--mut)}
.tag.sold{color:var(--pos);border-color:rgba(62,207,142,.4)}
.photo{text-align:center}
.photo img{max-height:240px;max-width:100%;border-radius:10px;display:block;margin:0 auto 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--txt)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.calc{background:var(--card2);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.calc .t{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:700;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
.n{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3040;border:1px solid var(--line);padding:10px 16px;border-radius:20px;z-index:20;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.warn{background:rgba(255,203,5,.08);border:1px solid rgba(255,203,5,.4);border-radius:var(--r);padding:14px;margin-bottom:12px}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin:4px 0 10px}
ol{padding-left:20px;margin:6px 0}ol li{margin-bottom:6px}
textarea{width:100%;height:120px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;font:12px monospace;padding:8px}
a{color:var(--blue)}
svg text{fill:var(--mut);font-size:10px}
.hide{display:none!important}
</style>
</head>
<body>
<header><h1>Poke<span>Trade</span> <small id="ver" style="font-size:11px;color:var(--mut);font-weight:500"></small></h1><span id="sync"></span><button id="setBtn" data-act="goSettings" style="background:none;border:0;color:var(--mut);font-size:20px;padding:0 0 0 8px;cursor:pointer" aria-label="Réglages">⚙︎</button></header>
<main id="app"></main>
<nav id="nav">
  <button data-v="home"><b>🃏</b>Cartes</button>
  <button data-v="items"><b>📦</b>Items</button>
  <button data-v="choose" class="add"><b>＋</b>Ajouter</button>
  <button data-v="costs"><b>€</b>Frais</button>
  <button data-v="stats"><b>◔</b>Dashboard</button>
  <button data-v="vinted"><b>🏷️</b>Vinted</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- Version ---------- */
const APP_VERSION='3.1';
const APP_URL='https://florianbver-boop.github.io/poketrade/';

/* ---------- Réglages locaux ---------- */
const LS={get(k,d=''){try{return localStorage.getItem('pt_'+k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem('pt_'+k,v)}catch(e){}}};
const DEFAULT_MODEL='gemini-3.8-flash';
const getKey=()=>LS.get('gemini_key');
const getModel=()=>{const m=LS.get('model2',DEFAULT_MODEL);return m||DEFAULT_MODEL};
const getSheet=()=>LS.get('sheet_url').trim();

/* ---------- Miniatures (IndexedDB, sur ce téléphone) ---------- */
const IDB={db:null,open(){return new Promise(res=>{try{const r=indexedDB.open('poketrade',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  get(k){return new Promise(res=>{if(!this.db)return res(null);const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})},
  set(k,v){return new Promise(res=>{if(!this.db)return res();const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res})}};
let thumbs={};
const saveThumbs=()=>IDB.set('thumbs',thumbs);

/* ---------- Utils ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const has=v=>v!==''&&v!==null&&v!==undefined&&isFinite(parseFloat(String(v).replace(',','.')));
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(n||0);
const sgn=n=>n>0.004?'pos':n<-0.004?'neg':'mut';
const pct=n=>isFinite(n)?(n*100).toFixed(1).replace('.',',')+' %':'—';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const D=s=>{if(!s)return null;const d=new Date(String(s).slice(0,10)+'T00:00:00');return isNaN(d)?null:d};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),m.length>80?9000:2800)}

const COMPANIES=['Non gradée','PSA','CGC','PCA','Collect Aura','BGS','SGC','TAG','ACE','AGS','EGS','MNT'];
const ITEM_CATS=['ETB','UPC','Display','Coffret','Tripack','Bundle','Booster','Blister','Mini-tin','Pokébox','Accessoire','Autre'];
const GRADES=['10 Black Label','10 Gold Label','10','9.5','9','8.5','8','7.5','7','6.5','6','5.5','5','4.5','4','3.5','3','2.5','2','1.5','1'];
const TYPES=['Carte','Scellé','Autre'];
const CATS=['Bot','Cookgroup','Proxies','Autre'];
const FREQS=['Mensuel','Annuel','Ponctuel'];

/* ---------- Données (Google Sheet) ---------- */
let data={cartes:[],items:[],frais:[],url:''};
try{const c=JSON.parse(LS.get('cache','null'));if(c)data={...data,...c,items:c.items||[]}}catch(e){}
const PENDING=()=>{try{return JSON.parse(LS.get('pending_items','[]'))}catch(e){return[]}};
const setPending=a=>LS.set('pending_items',JSON.stringify(a));
const scriptOld=()=>getSheet()&&data.v===undefined;
function setData(j){data={v:j.v,cartes:j.cartes||[],items:[...(j.items||[]),...(j.v?[]:PENDING())],frais:j.frais||[],url:j.url||data.url};LS.set('cache',JSON.stringify(data));LS.set('synced',new Date().toISOString());syncInfo()}
function syncInfo(s){$('#sync').textContent=s||(getSheet()?'✓ Google Sheet':'⚠ Sheet non connecté')}
const SHEET_HTML_ERR='Le script Google a répondu par une page web au lieu des données. Dans Apps Script : Déployer → Gérer les déploiements → ✏️ → Version : Nouvelle version, Accès : « Tout le monde » → Déployer.';
async function readSheet(r){const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error(SHEET_HTML_ERR)}}
async function flushPending(){const pend=PENDING();if(!pend.length||!data.v)return;
  for(const it of pend){try{await sheetPost('saveItem',{data:it});setPending(PENDING().filter(x=>x.id!==it.id))}catch(e){return}}
  toast(`✓ ${pend.length} item(s) en attente envoyé(s) dans le Sheet`)}
async function sheetGet(){
  const u=getSheet();if(!u)throw new Error('Google Sheet non connecté (Réglages)');
  const r=await fetch(u,{redirect:'follow'}).catch(()=>{throw new Error('Impossible de joindre le Google Sheet (réseau ou URL).')});const j=await readSheet(r);
  if(!j.ok)throw new Error(j.error||'Erreur Sheet');setData(j);if(j.v&&PENDING().length){await flushPending();}return j;
}
async function sheetPost(action,payload){
  const u=getSheet();if(!u)throw new Error('Connecte d’abord ton Google Sheet dans Réglages');
  syncInfo('⟳ Enregistrement…');
  try{const r=await fetch(u,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})}).catch(()=>{throw new Error('Impossible de joindre le Google Sheet (réseau).')});
    const j=await readSheet(r);if(!j.ok)throw new Error(j.error||'Erreur Sheet');
    if(!j.v&&/Item/.test(action)){setData(j);const e=new Error('OLD_SCRIPT');e.old=true;throw e}
    setData(j);}
  catch(e){syncInfo();throw e}
}

/* ---------- Calculs ---------- */
function calc(c){const cost=num(c.buyPrice)+num(c.gradeCost);const sold=has(c.sellPrice);const profit=sold?num(c.sellPrice)-cost:null;return{cost,sold,profit,roi:sold&&cost>0?profit/cost:NaN}}
function addMonths(d,k){const day=d.getDate();const r=new Date(d.getFullYear(),d.getMonth()+k,1);r.setDate(Math.min(day,new Date(r.getFullYear(),r.getMonth()+1,0).getDate()));return r}
function costInRange(c,lo,hi){
  const start=D(c.start);if(!start)return 0;const end=D(c.end);
  const top=new Date(Math.min(hi,end?end.getTime()+86399000:8.64e15,Date.now()));const amt=num(c.amount);
  if(c.freq==='Ponctuel')return start>=lo&&start<=top?amt:0;
  const step=c.freq==='Annuel'?12:1;let t=0;
  for(let k=0;k<1200;k+=step){const d=addMonths(start,k);if(d>top)break;if(d>=lo)t+=amt}return t;
}
const inR=(s,a,b)=>{const d=D(s);return d&&d>=a&&d<=b};

/* ---------- Gemini ---------- */
const PROMPT=`Tu es expert en cartes Pokémon (JCC) et en gradation (PSA, CGC, PCA, Collect Aura, BGS, SGC).
Identifie chaque carte ou produit Pokémon visible sur la photo (une entrée par objet).
Pour chaque carte, lis précisément :
- nom : nom exact de la carte (ex. "Dracaufeu ex", "Pikachu VMAX")
- numero : numéro imprimé en bas de la carte ou sur l'étiquette du boîtier (ex. "199/165", "TG05/TG30", "SVP 056")
- serie : nom de l'extension/série (ex. "Écarlate et Violet 151", "Évolutions Prismatiques"), dans la langue de la carte
- langue : FR, EN, JP, etc.
- societe : si la carte est dans un boîtier gradé, le nom de la société tel qu'écrit sur l'étiquette (ex. PSA, CGC, PCA, Collect Aura, BGS, SGC, TAG, ACE…), sinon "Non gradée"
- note : la note lue sur l'étiquette. Note de 1 à 10 (demi-points possibles). Distingue bien : "10" (étiquette classique/blanche), "10 Gold Label" (étiquette dorée, ex. CGC Pristine 10), "10 Black Label" (étiquette noire, ex. BGS Black Label ou CGC Perfect 10). Vide si non gradée.
Utilise les informations écrites sur l'étiquette du boîtier en priorité. N'invente rien : chaîne vide si illisible, et confiance "basse".`;
const SCHEMA={type:'OBJECT',properties:{objets:{type:'ARRAY',items:{type:'OBJECT',properties:{
  nom:{type:'STRING'},numero:{type:'STRING'},serie:{type:'STRING'},langue:{type:'STRING'},
  societe:{type:'STRING'},note:{type:'STRING'},confiance:{type:'STRING',enum:['haute','moyenne','basse']}
},required:['nom','societe']}}},required:['objets']};
const PROMPT_ITEM=`Tu es expert en produits scellés Pokémon (JCC) : ETB (Coffret Dresseur d'Élite), UPC (Ultra Premium Collection), Display, Coffret, Tripack, Bundle, Booster, Blister, Mini-tin, Pokébox, accessoires…
Identifie chaque produit visible sur la photo (une entrée par produit différent ; si le même produit apparaît plusieurs fois, une seule entrée avec la quantité).
- nom : nom commercial du produit (ex. "ETB Évolutions Prismatiques", "UPC Dracaufeu", "Coffret Collection Premium Mew ex")
- categorie : une de ${ITEM_CATS.join(', ')}
- serie : extension/série (ex. "Évolutions Prismatiques", "151")
- langue : FR, EN, JP, etc.
- quantite : nombre d'exemplaires visibles de ce produit
N'invente rien : chaîne vide si illisible, et confiance "basse".`;
const SCHEMA_ITEM={type:'OBJECT',properties:{objets:{type:'ARRAY',items:{type:'OBJECT',properties:{
  nom:{type:'STRING'},categorie:{type:'STRING',enum:ITEM_CATS},serie:{type:'STRING'},langue:{type:'STRING'},quantite:{type:'INTEGER'},confiance:{type:'STRING',enum:['haute','moyenne','basse']}
},required:['nom','categorie']}}},required:['objets']};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let gemStatus=()=>{};
const netErr=()=>{const e=new Error(location.hostname.endsWith('github.io')
  ?'Impossible de joindre Gemini (réseau). Vérifie ta connexion, coupe un éventuel VPN / bloqueur de contenu, puis réessaie.'
  :'Cette page ne peut pas appeler Gemini. Ouvre l’app ici : florianbver-boop.github.io/poketrade');e.status=0;return e};
let lastGround=null,lastModel='';
async function callModel(model,parts,schema,extra={}){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
    {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':getKey()},
     body:JSON.stringify({contents:[{parts}],...(extra.tools?{tools:extra.tools}:{}),generationConfig:schema?{responseMimeType:'application/json',responseSchema:schema,temperature:0.1}:{temperature:0.4}})}).catch(()=>{throw netErr()});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error?.message||('HTTP '+r.status));e.status=r.status;e.code=j.error?.status||'';throw e}
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  if(!txt){const e=new Error('Réponse vide');e.status=503;throw e}
  lastGround=j.candidates?.[0]?.groundingMetadata||null;lastModel=model;
  return txt;
}
const busyErr=e=>[429,500,502,503,504].includes(e.status)||/UNAVAILABLE|RESOURCE_EXHAUSTED|overload|high demand|try again/i.test(e.code+' '+e.message);
const goneErr=e=>e.status===404||/no longer available|not found|not supported/i.test(e.message);
/* Liste des modèles Gemini de ton compte qui savent lire une image (mise en cache 1 jour). */
async function fallbackModels(main){
  let list=null;
  try{const c=JSON.parse(LS.get('models_cache','null'));if(c&&Date.now()-c.t<864e5)list=c.m}catch(e){}
  if(!list){
    try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':getKey()}});
      const j=await r.json();
      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m=>m.name.replace('models/',''))
        .filter(n=>/^gemini-/.test(n)&&/flash|pro/.test(n)&&!/image|tts|audio|live|embed|vision-preview|thinking-exp|computer|robotics/.test(n));
      const ver=n=>parseFloat((n.match(/gemini-(\d+(\.\d+)?)/)||[])[1]||0);
      const rank=n=>(/-lite/.test(n)?1:0)+(/pro/.test(n)?2:0)+(/preview|exp/.test(n)?0.5:0)+(/-\d{3,}$/.test(n)?0.3:0);
      list.sort((a,b)=>ver(b)-ver(a)||rank(a)-rank(b));
      LS.set('models_cache',JSON.stringify({t:Date.now(),m:list}));
    }catch(e){list=[]}
  }
  return list.filter(n=>n!==main).slice(0,4);
}
async function gemini(parts,json=SCHEMA,extra={}){
  if(!getKey())throw new Error('Ajoute ta clé Gemini dans Réglages');
  const main=getModel();let last;
  for(let a=0;a<3;a++){
    try{return await callModel(main,parts,json,extra)}
    catch(e){last=e;if(goneErr(e))break;if(!busyErr(e))throw e;
      if(a<2){gemStatus(`Gemini surchargé, nouvel essai (${a+2}/3)…`);await sleep(1500*(a+1))}}
  }
  for(const m of await fallbackModels(main)){
    gemStatus(`Essai avec ${m}…`);
    try{const t=await callModel(m,parts,json,extra);gemStatus(`✓ Lu avec ${m}`);return t}
    catch(e){last=e;if(!busyErr(e)&&!goneErr(e)&&e.status!==400)throw e}
  }
  throw new Error((last&&busyErr(last))?'Gemini est saturé en ce moment. Réessaie dans quelques minutes (ou remplis la fiche à la main).':(last?last.message:'Erreur'));
}
function normGrade(g){g=String(g||'').trim();if(!g)return'';const l=g.toLowerCase();
  if(l.includes('black'))return'10 Black Label';if(l.includes('gold')||l.includes('pristine'))return'10 Gold Label';
  const m=g.replace(',','.').match(/\d+(\.5)?/);return m&&GRADES.includes(m[0])?m[0]:''}

function resize(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

/* ---------- Calculs globaux (cartes + items) ---------- */
const calcI=it=>{const cost=num(it.buyPrice);const sold=has(it.sellPrice);const profit=sold?num(it.sellPrice)-cost:null;return{cost,sold,profit,roi:sold&&cost>0?profit/cost:NaN}};
function allObjects(){return[...data.cartes.map(c=>({o:c,kind:'card',k:calc(c),grad:num(c.gradeCost),buy:num(c.buyPrice)})),...data.items.map(i=>({o:i,kind:'item',k:calcI(i),grad:0,buy:num(i.buyPrice)}))]}
function totals(lo,hi){
  const ins=d=>!lo||inR(d,lo,hi);const all=allObjects();
  const sold=all.filter(x=>x.k.sold&&ins(x.o.sellDate||x.o.buyDate));
  let ventes=0,coutVendu=0,margeC=0,margeI=0;
  sold.forEach(x=>{ventes+=num(x.o.sellPrice);coutVendu+=x.k.cost;if(x.kind==='card')margeC+=x.k.profit;else margeI+=x.k.profit});
  const bought=all.filter(x=>ins(x.o.buyDate));
  const achats=bought.reduce((s,x)=>s+x.buy,0),grad=bought.reduce((s,x)=>s+x.grad,0);
  const L=lo||new Date(2000,0,1),H=hi||new Date(8.64e15);
  const frais=data.frais.reduce((s,f)=>s+costInRange(f,L,H),0);
  const marge=ventes-coutVendu,net=marge-frais;
  const stockL=all.filter(x=>!x.k.sold);
  const fraisL=data.frais.map(f=>({f,v:costInRange(f,L,H)})).filter(x=>x.v>0);
  return{sold,bought,stockL,fraisL,ventes,coutVendu,margeC,margeI,achats,grad,frais,marge,net,roi:(coutVendu+frais)>0?net/(coutVendu+frais):NaN,cash:ventes-achats-grad-frais,
    stock:stockL.reduce((s,x)=>s+x.k.cost,0),nbStock:stockL.length};
}

  const all=data.frais.reduce((s,x)=>s+costInRange(x,new Date(2000,0,1),new Date()),0);
  app.innerHTML=`${noSheet()}<h2>Frais annexes</h2>

    <div class="row"><label>Depuis le<input type="date" name="start" value="${esc(c.start||'')}" required></label><label>Jusqu'au <span class="mut">(vide = en cours)</span><input type="date" name="end" value="${esc(c.end||'')}"></label></div>
    <button class="btn pri big" id="cBtn">${costEdit?'Mettre à jour':'Ajouter ce frais'}</button>

  </form>

  $('#cf').onsubmit=async e=>{e.preventDefault();if(busy)return;const o={};new FormData(e.target).forEach((v,k)=>o[k]=String(v).trim());o.amount=num(o.amount);o.id=costEdit||uid();

function range(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  return{all:[null,null],month:[new Date(y,m,1),new Date(y,m+1,0,23,59,59)],lastmonth:[new Date(y,m-1,1),new Date(y,m,0,23,59,59)],year:[new Date(y,0,1),new Date(y,11,31,23,59,59)],lastyear:[new Date(y-1,0,1),new Date(y-1,11,31,23,59,59)]}[period]}
function renderStats(){
  const [lo,hi]=range();const t=totals(lo,hi);
  const P={all:'Depuis le début',month:'Ce mois',lastmonth:'Mois dernier',year:'Cette année',lastyear:'Année dernière'};
  const n=new Date();const ms=[];
  for(let i=11;i>=0;i--){const a=new Date(n.getFullYear(),n.getMonth()-i,1),b=new Date(n.getFullYear(),n.getMonth()-i+1,0,23,59,59);ms.push({l:a.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),v:totals(a,b).net})}
  const byCat={};data.frais.forEach(f=>{const v=costInRange(f,lo||new Date(2000,0,1),hi||new Date(8.64e15));if(v)byCat[f.cat]=(byCat[f.cat]||0)+v});
  const top=t.sold.slice().sort((a,b)=>b.k.profit-a.k.profit);
  const st={c:t.stockL.filter(x=>x.kind==='card'),i:t.stockL.filter(x=>x.kind==='item')};
  const K=(key,label,val,cls='')=>`<div class="kpi" data-act="detail" data-k="${key}"><small>${label}</small><b class="${cls}">${val}</b></div>`;
  app.innerHTML=`<h2>Dashboard</h2>
  <select id="per" style="margin:0 0 12px">${Object.entries(P).map(([k,l])=>`<option value="${k}" ${period===k?'selected':''}>${l}</option>`).join('')}</select>
  <div class="kpis">
    <div class="kpi hero" data-act="detail" data-k="net"><small>Bénéfice net</small><b class="${sgn(t.net)}">${eur(t.net)}</b><small>${t.net>=0?'Tu gagnes de l’argent':'Tu perds de l’argent'} · ROI ${pct(t.roi)}</small></div>
    ${K('ventes',`Ventes (${t.sold.length} objets)`,eur(t.ventes))}
    ${K('coutVendu','Coût des objets vendus',eur(t.coutVendu))}
    ${K('marge','Marge sur les ventes',eur(t.marge),sgn(t.marge))}
    ${K('margeC','dont cartes',eur(t.margeC),sgn(t.margeC))}
    ${K('margeI','dont items',eur(t.margeI),sgn(t.margeI))}
    ${K('frais','Frais annexes','−'+eur(t.frais),'neg')}
    ${K('achats',`Achats (${t.bought.length})`,eur(t.achats))}
    ${K('grad','Gradation',eur(t.grad))}
    ${K('cash','Trésorerie',eur(t.cash),sgn(t.cash))}
    ${K('roi','ROI net',pct(t.roi),sgn(t.net))}
    ${K('stock',`Stock non vendu (${t.stockL.length})`,eur(t.stock))}
    ${K('stockC',`Stock cartes (${st.c.length})`,eur(st.c.reduce((s,x)=>s+x.k.cost,0)))}
    ${K('stockI',`Stock items (${st.i.length})`,eur(st.i.reduce((s,x)=>s+x.k.cost,0)))}
  </div>
  <p class="hint">Touche un chiffre pour voir le détail.</p>
  <h3>Bénéfice net par mois</h3><div class="card">${chart(ms)}</div>
  ${Object.keys(byCat).length?`<h3>Frais annexes</h3><div class="card" style="padding:4px 10px"><table>${Object.entries(byCat).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${eur(v)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="n"><b>${eur(t.frais)}</b></td></tr></table></div>`:''}
  ${top.length?`<h3>Ventes</h3><div class="card" style="padding:4px 10px"><table><tr><th>Objet</th><th class="n">Coût</th><th class="n">Vente</th><th class="n">Bénéf.</th></tr>${top.map(({o:c,kind,k})=>`<tr data-act="${kind==='item'?'editItem':'edit'}" data-id="${esc(c.id)}" style="cursor:pointer"><td>${kind==='item'?'📦 ':''}${esc(c.name)}<br><small class="mut">${esc(kind==='item'?(c.cat||'Item'):(c.gradeCompany&&c.gradeCompany!=='Non gradée'?c.gradeCompany+' '+c.grade:'Raw'))}</small></td><td class="n">${eur(k.cost)}</td><td class="n">${eur(num(c.sellPrice))}</td><td class="n ${sgn(k.profit)}">${eur(k.profit)}</td></tr>`).join('')}</table></div>`:''}

let detailKey=null;
const objRow=(x,amount,sub)=>({name:(x.kind==='item'?'📦 ':'🃏 ')+(x.o.name||'Sans nom')+(x.kind==='item'&&num(x.o.qty)>1?' ×'+num(x.o.qty):''),sub,amount,act:x.kind==='item'?'editItem':'edit',id:x.o.id});
const fdate=s=>{const d=D(s);return d?d.toLocaleDateString('fr-FR'):''};
const gradeTxt=o=>o.gradeCompany&&o.gradeCompany!=='Non gradée'&&o.grade?o.gradeCompany+' '+o.grade:'';
function groupRows(list,map){const c=list.filter(x=>x.kind==='card'),i=list.filter(x=>x.kind==='item');const out=[];
  [[c,'Cartes'],[i,'Items']].forEach(([l,lab])=>{if(!l.length)return;const rows=l.map(map);out.push({group:`${lab} (${l.length})`,gtotal:rows.reduce((s,r)=>s+r.amount,0)},...rows.sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount)))});return out}
function detailData(k,t){
  const sumRow=(name,amount,key,sub='')=>({name,amount,sub,act:key?'detail':null,k:key});
  switch(k){
    case 'net':return{title:'Bénéfice net',explain:'Marge sur les objets vendus, moins les frais annexes de la période.',rows:[sumRow('Marge sur les ventes',t.marge,'marge'),sumRow('Frais annexes',-t.frais,'frais')],total:t.net};
    case 'roi':return{title:'ROI net',explain:'Bénéfice net ÷ (coût des objets vendus + frais annexes).',rows:[sumRow('Bénéfice net',t.net,'net'),sumRow('Coût des objets vendus',t.coutVendu,'coutVendu'),sumRow('Frais annexes',t.frais,'frais')],totalTxt:pct(t.roi)};
    case 'cash':return{title:'Trésorerie',explain:'Ce que tu as encaissé moins tout ce que tu as dépensé sur la période, stock compris.',rows:[sumRow('Ventes encaissées',t.ventes,'ventes'),sumRow('Achats',-t.achats,'achats'),sumRow('Gradation',-t.grad,'grad'),sumRow('Frais annexes',-t.frais,'frais')],total:t.cash};
    case 'ventes':return{title:'Ventes',explain:'Prix de vente des objets vendus sur la période.',rows:groupRows(t.sold,x=>objRow(x,num(x.o.sellPrice),'Vendu le '+fdate(x.o.sellDate))),total:t.ventes};
    case 'coutVendu':return{title:'Coût des objets vendus',explain:'Prix d’achat + gradation des objets vendus.',rows:groupRows(t.sold,x=>objRow(x,x.k.cost,`achat ${eur(x.buy)}${x.grad?' + gradation '+eur(x.grad):''}`)),total:t.coutVendu};
    case 'marge':return{title:'Marge sur les ventes',explain:'Prix de vente − (achat + gradation), objet par objet.',rows:groupRows(t.sold,x=>objRow(x,x.k.profit,`vendu ${eur(num(x.o.sellPrice))} − coût ${eur(x.k.cost)} · ${pct(x.k.roi)}`)),total:t.marge};
    case 'margeC':{const l=t.sold.filter(x=>x.kind==='card');return{title:'Marge sur les cartes',explain:'Cartes vendues sur la période.',rows:l.map(x=>objRow(x,x.k.profit,`vendue ${eur(num(x.o.sellPrice))} − coût ${eur(x.k.cost)}${gradeTxt(x.o)?' · '+gradeTxt(x.o):''}`)).sort((a,b)=>b.amount-a.amount),total:t.margeC}}
    case 'margeI':{const l=t.sold.filter(x=>x.kind==='item');return{title:'Marge sur les items',explain:'Items vendus sur la période.',rows:l.map(x=>objRow(x,x.k.profit,`vendu ${eur(num(x.o.sellPrice))} − coût ${eur(x.k.cost)}`)).sort((a,b)=>b.amount-a.amount),total:t.margeI}}
    case 'frais':return{title:'Frais annexes',explain:'Montants payés sur la période (abonnements comptés à chaque échéance).',rows:t.fraisL.sort((a,b)=>b.v-a.v).map(({f,v})=>({name:f.name,sub:`${f.cat} · ${f.freq} · ${eur(num(f.amount))}${f.freq==='Ponctuel'?'':' par échéance'}`,amount:v,act:'costEditGo',id:f.id})),total:t.frais};
    case 'achats':return{title:'Achats',explain:'Prix d’achat des objets achetés sur la période (vendus ou non).',rows:groupRows(t.bought,x=>objRow(x,x.buy,'Acheté le '+fdate(x.o.buyDate)+(x.k.sold?' · vendu':' · en stock'))),total:t.achats};
    case 'grad':{const l=t.bought.filter(x=>x.grad>0);return{title:'Gradation',explain:'Coûts de gradation des cartes achetées sur la période.',rows:l.map(x=>objRow(x,x.grad,gradeTxt(x.o)||'')).sort((a,b)=>b.amount-a.amount),total:t.grad}}
    case 'stock':return{title:'Stock non vendu',explain:'Tout ce qui n’est pas encore vendu, au prix de revient (achat + gradation).',rows:groupRows(t.stockL,x=>objRow(x,x.k.cost,[gradeTxt(x.o),x.kind==='item'?x.o.cat:'','acheté le '+fdate(x.o.buyDate)].filter(Boolean).join(' · '))),total:t.stock};
    case 'stockC':case 'stockI':{const kind=k==='stockC'?'card':'item';const l=t.stockL.filter(x=>x.kind===kind);const rows=l.map(x=>objRow(x,x.k.cost,[gradeTxt(x.o),kind==='item'?x.o.cat:'','acheté le '+fdate(x.o.buyDate)].filter(Boolean).join(' · '))).sort((a,b)=>b.amount-a.amount);
      return{title:kind==='card'?'Stock cartes':'Stock items',explain:'Au prix de revient (achat + gradation).',rows,total:rows.reduce((s,r)=>s+r.amount,0)}}
  }
  return{title:'',rows:[],total:0};
}
function showDetail(k,t){
  const d=detailData(k,t);const m=document.createElement('div');m.className='modal';m.id='modal';
  const rows=d.rows.length?d.rows.map(r=>r.group?`<div class="dgroup"><span>${esc(r.group)}</span><span>${eur(r.gtotal)}</span></div>`
    :`<div class="drow" ${r.act?`data-act="${r.act}" ${r.k?`data-k="${r.k}"`:''} ${r.id?`data-id="${esc(r.id)}"`:''}`:''}><div class="l"><b>${esc(r.name)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:''}</div><div class="a ${r.amount<0?'neg':''}">${eur(r.amount)}</div>${r.act?'<span class="mut">›</span>':''}</div>`).join('')
    :'<div class="empty">Rien sur cette période.</div>';
  m.innerHTML=`<div class="sheet"><h2><span>${esc(d.title)}</span><button class="btn" data-act="closeDetail">✕</button></h2>
    <p class="hint" style="margin-top:-6px">${esc(d.explain||'')}</p>${rows}
    <div class="dtotal"><span>Total</span><span class="${['net','marge','margeC','margeI','cash'].includes(k)?sgn(d.total):''}">${d.totalTxt||eur(d.total)}</span></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)closeDetail()});
}
function closeDetail(){detailKey=null;const m=$('#modal');if(m)m.remove()}
function chart(ms){const W=640,H=210,top=16,bot=180,bw=(W-16)/ms.length;
  const mp=Math.max(0,...ms.map(m=>m.v)),mn=Math.max(0,...ms.map(m=>-m.v));if(!mp&&!mn)return'<div class="empty">Pas encore de données</div>';
  const sc=(bot-top)/(mp+mn),z=top+mp*sc;
  return`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="#2c3140"/>${ms.map((m,i)=>{const h=Math.abs(m.v)*sc,x=8+i*bw+bw*.18,w=bw*.64,y=m.v>=0?z-h:z;
    return`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3" fill="${m.v>=0?'#3ecf8e':'#ff6b6b'}"/>${m.v?`<text x="${x+w/2}" y="${m.v>=0?y-4:y+h+11}" text-anchor="middle">${Math.round(m.v)}</text>`:''}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${m.l}</text>`}).join('')}</svg>`}

function vintedContext(){
  const all=allObjects();const x=all.find(x=>x.o.id===vinted.objId);if(!x)return'';
  const o=x.o;
  return `\n\nINFORMATIONS DE MON STOCK (à utiliser pour vérifier ton identification, sans les recopier si la photo les contredit) :
${x.kind==='item'?`Produit scellé : ${o.name} (${o.cat||''}), série ${o.set||'?'}, langue ${o.lang||'?'}, quantité ${o.qty||1}`:`Carte : ${o.name} ${o.number||''}, série ${o.set||'?'}, langue ${o.lang||'?'}, gradation ${gradeTxt(o)||'non gradée'}`}
Mon prix de revient (achat${x.grad?' + gradation':''}) : ${eur(x.k.cost)}. Si ton prix plancher est inférieur à ce montant, signale-le clairement dans l'analyse marché.`;
}
function renderVinted(){
  const objs=allObjects().filter(x=>!x.k.sold);
  const sel=objs.find(x=>x.o.id===vinted.objId);
  const imgs=vinted.photos.length?vinted.photos:(sel&&thumbs[sel.o.id]?[thumbs[sel.o.id]]:[]);
  app.innerHTML=`<h2>Annonce Vinted</h2>
  <div class="card">
    <label>Objet de ton stock <span class="mut">(facultatif, pour comparer à ton prix de revient)</span>
      <select id="vObj"><option value="">— Aucun —</option>${objs.map(x=>`<option value="${esc(x.o.id)}" ${x.o.id===vinted.objId?'selected':''}>${x.kind==='item'?'📦':'🃏'} ${esc(x.o.name)}${x.o.number?' '+esc(x.o.number):''}${gradeTxt(x.o)?' · '+esc(gradeTxt(x.o)):''} · ${eur(x.k.cost)}</option>`).join('')}</select></label>
    <div class="photo">
      ${imgs.length?`<div class="bar" style="justify-content:center;margin-bottom:10px">${imgs.map(s=>`<img src="${s}" alt="" style="height:120px;width:auto;margin:0;border-radius:8px">`).join('')}</div>`:'<div style="font-size:34px">📝</div><p class="mut" style="margin:4px 0 12px">Ajoute 1 à 4 photos : face, dos du boîtier (sous-notes), étiquette…</p>'}
      <div class="row">
        <label class="btn" for="vCam" style="margin:0;color:var(--txt)">📷 Photo</label>
        <label class="btn" for="vLib" style="margin:0;color:var(--txt)">🖼️ Album</label>
        ${vinted.photos.length?'<button class="btn" data-act="vClear">Effacer</button>':''}
      </div>
      <input type="file" id="vCam" accept="image/*" capture="environment" class="hide"><input type="file" id="vLib" accept="image/*" multiple class="hide">
      ${!vinted.photos.length&&sel&&thumbs[sel.o.id]?'<p class="hint">Photo de ta fiche utilisée (petite). Pour lire les sous-notes, ajoute une vraie photo.</p>':''}
    </div>
    <button class="btn pri big" id="vGo" data-act="vGenerate" ${vinted.busy||!imgs.length?'disabled':''}>${vinted.busy?'Analyse en cours… (30 s à 1 min)':'✨ Générer l’annonce'}</button>
    <p class="hint" id="vMsg">${getKey()?'Gemini cherche les ventes récentes sur le web avant de proposer un prix.':'⚠ Ajoute ta clé Gemini dans Réglages.'}</p>
  </div>
  <div id="vOut">${vinted.out?renderVintedOut(vinted.out):''}</div>`;
  $('#vObj').onchange=e=>{vinted.objId=e.target.value;renderVinted()};
  const onFiles=async e=>{const files=[...e.target.files].slice(0,4);if(!files.length)return;
    try{for(const f of files){if(vinted.photos.length>=4)break;const img=await loadImage(f);vinted.photos.push(resize(img,1600,.88))}}catch(err){toast(err.message)}
    renderVinted()};
  $('#vCam').onchange=onFiles;$('#vLib').onchange=onFiles;
}
function renderVintedOut(out){
  const blocks=[];
  let html=esc(out.text).replace(/```(?:text)?\n?([\s\S]*?)```\n?/g,(m,b)=>{blocks.push(b.trim());const i=blocks.length-1;
    return `\u0000B${i}\u0000`});
  html=html.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^(\d\. .+)$/gm,'<span class="vh">$1</span>');
  html=html.replace(/\u0000B(\d+)\u0000/g,(m,i)=>`<div class="vblock"><pre>${blocks[i]}</pre><button class="btn" data-act="vCopy" data-i="${i}">📋 Copier</button></div>`);
  vinted.blocks=blocks.map(b=>b.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));
  const src=(out.sources||[]).slice(0,8);
  return `<div class="card vout">${out.noWeb?'<div class="warn" style="margin-bottom:10px">⚠ La recherche web n’a pas pu être utilisée : les prix sont des estimations de Gemini, à vérifier.</div>':''}
    <div class="vtext">${html}</div>
    ${src.length?`<h3>Sources consultées par Gemini</h3>${src.map(s=>`<div class="hint">· <a href="${esc(s.uri)}" target="_blank" rel="noopener">${esc(s.title||s.uri)}</a></div>`).join('')}`:''}
    <p class="hint">Généré le ${esc(out.date||'')}${out.model?' avec '+esc(out.model):''}. Vérifie toujours les prix avant de publier.</p></div>`;
}
async function vintedGenerate(){
  const sel=allObjects().find(x=>x.o.id===vinted.objId);
  const imgs=vinted.photos.length?vinted.photos:(sel&&thumbs[sel.o.id]?[thumbs[sel.o.id]]:[]);
  if(!imgs.length)return toast('Ajoute au moins une photo');
  vinted.busy=true;renderVinted();
  gemStatus=s=>{const el=$('#vMsg');if(el)el.textContent=s};
  const parts=[{text:VINTED_PROMPT+`\n\nDate du jour : ${new Date().toLocaleDateString('fr-FR')}.`+vintedContext()},...imgs.map(s=>({inline_data:{mime_type:'image/jpeg',data:s.split(',')[1]}}))];
  let text,noWeb=false;
  try{
    try{text=await gemini(parts,null,{tools:[{google_search:{}}]})}
    catch(e){if(e.status===400||/tool|search|grounding/i.test(e.message)){noWeb=true;lastGround=null;text=await gemini(parts,null)}else throw e}
    const g=lastGround||{};
    const sources=(g.groundingChunks||[]).map(c=>c.web).filter(Boolean);
    vinted.out={text,sources,noWeb,date:new Date().toLocaleString('fr-FR'),model:lastModel};
    LS.set('vinted_last',JSON.stringify(vinted.out));
  }catch(err){toast('Erreur Gemini : '+err.message)}
  finally{vinted.busy=false;renderVinted();const o=$('#vOut');if(o&&vinted.out)o.scrollIntoView({behavior:'smooth'})}
}

/* ---------- Événements ---------- */
document.addEventListener('click',async e=>{
  const n=e.target.closest('#nav button');if(n){go(n.dataset.v);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='detail'){closeDetail();detailKey=el.dataset.k;if(view==='stats')renderStats();return}
  if(a==='closeDetail'){closeDetail();return}
  if(a==='costEditGo'){closeDetail();costEdit=el.dataset.id;go('costs');return}
  if($('#modal')&&(a==='edit'||a==='editItem'))closeDetail();
  if(a==='toVinted'){vinted.objId=el.dataset.id;vinted.photos=[];vinted.out=null;go('vinted');return}
  if(a==='vGenerate'){vintedGenerate();return}
  if(a==='vClear'){vinted.photos=[];renderVinted();return}
  if(a==='vCopy'){try{await navigator.clipboard.writeText(vinted.blocks[+el.dataset.i]);toast('Copié ✓ — colle-le dans Vinted')}catch(err){toast('Copie impossible : sélectionne le texte à la main')}return}
  if(a==='new')go('add');
  else if(a==='newItem')go('additem');
  else if(a==='editItem')go('additem',el.dataset.id);
  else if(a==='cancelItem')go('items');
  else if(a==='ifilter'){ifilter=el.dataset.k;renderItems()}
  else if(a==='delItem'){if(!confirm('Supprimer cet item du Sheet ?'))return;try{await sheetPost('deleteItem',{id:editId});delete thumbs[editId];saveThumbs();toast('Supprimé');go('items')}catch(err){toast('Erreur : '+err.message)}}
  else if(a==='edit')go('add',el.dataset.id);
  else if(a==='cancel')go('home');
  else if(a==='goSettings')go('settings');
  else if(a==='filter'){filter=el.dataset.k;renderHome()}
  else if(a==='refresh'){syncInfo('⟳');try{await sheetGet();toast('✓ À jour')}catch(err){toast(err.message);syncInfo()}render()}
  else if(a==='pick')pick(+el.dataset.i);
  else if(a==='del'){if(!confirm('Supprimer cette carte du Sheet ?'))return;try{await sheetPost('deleteCard',{id:editId});delete thumbs[editId];saveThumbs();toast('Supprimée');go('home')}catch(err){toast('Erreur : '+err.message)}}
  else if(a==='cat'){$('#cf').elements.cat.value=el.dataset.k;document.querySelectorAll('[data-act=cat]').forEach(c=>c.classList.toggle('on',c===el));const nm=$('#cf').elements.name;if(!nm.value)nm.focus()}
  else if(a==='costEdit'){costEdit=el.dataset.id;renderCosts();scrollTo(0,0)}
  else if(a==='costCancel'){costEdit=null;renderCosts()}
  else if(a==='costDel'){if(!confirm('Supprimer ce frais ?'))return;try{await sheetPost('deleteCost',{id:costEdit});costEdit=null;renderCosts()}catch(err){toast('Erreur : '+err.message)}}
  else if(a==='saveSheet'){LS.set('sheet_url',$('#sheet').value.trim());const m=$('#sMsg');m.textContent='Connexion…';
    try{const j=await sheetGet();renderSettings();toast(j.v?`✓ Connecté · nouveau script (v${j.v}) · ${j.cartes.length} cartes · ${(j.items||[]).length} items`:`⚠ Connecté, mais c'est l'ANCIEN script qui répond : les items ne peuvent pas être enregistrés.`)}catch(err){m.innerHTML=`<span class="neg">${esc(err.message)}</span>`}}
  else if(a==='saveKey'){LS.set('gemini_key',$('#key').value.trim());LS.set('model2',$('#model').value.trim()||DEFAULT_MODEL);const m=$('#kMsg');m.textContent='Test…';
    try{await gemini([{text:'Réponds OK'}],false);m.innerHTML='<span class="pos">✓ Gemini OK</span>'}catch(err){m.innerHTML=`<span class="neg">${esc(err.message)}</span>`}}
  else if(a==='copyUrl'){try{await navigator.clipboard.writeText(APP_URL);toast('Adresse copiée ✓')}catch(err){toast(APP_URL)}}
  else if(a==='reload'){location.replace(APP_URL+'?v='+Date.now())}
  else if(a==='copyCode'){try{await navigator.clipboard.writeText($('#code').value);toast('Code copié ✓')}catch(err){$('#code').select();toast('Sélectionne et copie le texte')}}
});

/* ---------- Démarrage ---------- */
(async()=>{
  const old=LS.get('model','');if(old&&!LS.get('model2'))LS.set('model2',/^gemini-(1|2)\./.test(old)?DEFAULT_MODEL:old);
  await IDB.open();thumbs=(await IDB.get('thumbs'))||{};
  /* Lien de configuration : …/poketrade/#sheet=URL_EXEC (le # n'est jamais envoyé à un serveur) */
  const mh=location.hash.match(/^#sheet=(.+)$/);
  if(mh){const u=decodeURIComponent(mh[1]).trim();
    if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){LS.set('sheet_url',u);setTimeout(()=>toast('✓ Adresse du Google Sheet enregistrée'),300)}
    history.replaceState(null,'',location.pathname)}
  $('#ver').textContent='v'+APP_VERSION;syncInfo();render();
  if(getSheet()){try{await sheetGet();render()}catch(e){syncInfo('⚠ Hors ligne')}}
})();
</script>
